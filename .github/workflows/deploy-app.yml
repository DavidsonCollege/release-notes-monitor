name: Deploy config API

# The Container App serves the config the release checker reads. Before this
# workflow existed, changes to app/ sat in git doing nothing until someone
# remembered to rebuild the image by hand.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch:

concurrency:
  group: deploy-config-api
  cancel-in-progress: false

# OIDC federation - no Azure credential is stored in GitHub.
permissions:
  id-token: write
  contents: read

env:
  ACR: dczendeskdispatcheracr
  IMAGE: release-notes-monitor
  APP_NAME: dc-release-notes-monitor-web
  APP_RG: dc-monitors-rg
  APP_URL: https://dc-release-notes-monitor-web.ashycliff-3a82f0e3.eastus.azurecontainerapps.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR
        run: |
          az acr build \
            --registry "$ACR" \
            --image "$IMAGE:${{ github.sha }}" \
            --image "$IMAGE:latest" \
            --file Dockerfile .

      - name: Roll the Container App
        run: |
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$APP_RG" \
            --image "$ACR.azurecr.io/$IMAGE:${{ github.sha }}" \
            --output none

      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/healthz" || echo 000)
            teams=$(curl -s "$APP_URL/api/config" \
              | python3 -c 'import sys,json;print(len(json.load(sys.stdin).get("teams",[])))' 2>/dev/null || echo 0)
            echo "attempt $i: healthz=$code teams=$teams"
            if [ "$code" = "200" ] && [ "$teams" -ge 1 ]; then
              echo "Smoke test passed - API healthy and serving a non-empty config."
              exit 0
            fi
            sleep 10
          done
          echo "Smoke test failed - the checker will fall back to config/teams.json."
          exit 1
